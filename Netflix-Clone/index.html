<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="header">
        <!-- Navigation -->
        <nav>
            <img src="./Assets/Images/logo.png" alt="Netflix-logo" class="logo">

            <a href="#" class="sign-in-btn">Sign In</a>
        </nav>

        <!-- Hero section -->

        <div class="hero-content">
            <h1>Unlimited movies, TV shows, and more</h1>
            <p>Starts at Rs 250. Cancel anytime.</p>
            <p class="small-text">Ready to watch? Enter your email to create or restart your membership.</p>

            <form class="email-signup-form" onsubmit="event.preventDefault();">
                <div class="input-container">
                    <input type="email" class="email-input" id="email" placeholder="" required>
                    <label for="email" class="input-label">Email address</label>
                </div>

                <button type="submit" class="get-started-btn">
                    Get Started
                    <svg class="chevron-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M9.29 15.88L13.17 12L9.29 8.12C8.9 7.73 8.9 7.1 9.29 6.71C9.68 6.32 10.31 6.32 10.7 6.71L15.29 11.3C15.68 11.69 15.68 12.32 15.29 12.71L10.7 17.3C10.31 17.69 9.68 17.69 9.29 17.3C8.9 16.91 8.9 16.27 9.29 15.88Z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</body>

</html>
